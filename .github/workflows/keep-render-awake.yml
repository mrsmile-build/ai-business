name: keep-render-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping the live Render service so it never sleeps
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://ai-business-90n6.onrender.com/" || echo 000)
          echo "ping result: $code"
