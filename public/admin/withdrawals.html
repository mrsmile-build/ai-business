<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Withdrawals | Admin</title><style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#e2e8f0;margin:0;padding:24px 16px;max-width:640px;margin:auto;line-height:1.6}h1{font-size:26px;color:#f8fafc}.green{color:#22c55e}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin:16px 0}input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:16px;margin:6px 0;box-sizing:border-box}button{width:100%;padding:14px;border:none;border-radius:8px;background:#22c55e;color:#0b1220;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}a.btn{display:block;text-align:center;padding:14px;border-radius:8px;background:#3b82f6;color:white;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;text-align:center}.stat b{display:block;font-size:24px;color:#22c55e}li{margin:6px 0}</style></head><body>
<h1>💸 Pending Partner Withdrawals</h1><div id="list">Loading...</div>
<script>
var API="https://ai-business-1-ok3x.onrender.com";var tok=localStorage.getItem("token");
if(!tok){location.href="/auth";};
fetch(API+"/api/admin/withdrawals",{headers:{Authorization:"Bearer "+tok}}).then(function(r){return r.json();}).then(function(d){
 var el=document.getElementById("list");
 if(d.error){el.innerHTML="<p>"+d.error+"</p>";return;}
 if(!d.withdrawals||!d.withdrawals.length){el.innerHTML="<p>No pending withdrawals. 🎉</p>";return;}
 el.innerHTML=d.withdrawals.map(function(w){var p=w.partners||{};
  return '<div class="card"><strong>'+p.company_name+'</strong> wants <strong>₦'+w.amount.toLocaleString()+'</strong><br>📱 '+(p.whatsapp||"—")+' · 🏦 '+(p.bank_name||"—")+' '+(p.account_number||"—")+'<br><br><button onclick="markPaid(\''+w.id+'\')">I Have Paid — Mark Paid</button></div>';}).join("");
});
function markPaid(id){fetch(API+"/api/admin/withdrawals/"+id+"/paid",{method:"POST",headers:{Authorization:"Bearer "+tok}}).then(function(){location.reload();});}
</script></body></html>
