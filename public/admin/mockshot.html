   h+='<div style="padding:2px 0 8px"><b style="font-size:12px;color:#94a3b8">Review wall \u00b7 '+arr.length+' happy customers</b></div>';
   for(i=0;i<arr.length;i++){ b=arr[i];
     h+='<div class="card"><div style="font-size:16px;letter-spacing:2px;color:#fbbf24;margin-bottom:6px">\u2605\u2605\u2605\u2605\u2605</div><p style="font-size:12px;color:#cbd5e1;margin:0 0 8px">\u201c'+b.svc[0][0]+' was excellent \u2014 fast, fair price, would refer.\u201d</p><div style="font-size:11px;color:#64748b">'+b.name+' \u00b7 '+b.loc+'</div></div>';
   }
 }
 return '<div class="m-body">'+h+'</div>';
}
function money(n){return "\u20a6"+Number(String(n).replace(/[^0-9.]/g,"")||0).toLocaleString();}
function fillSelects(){
  var bz=document.getElementById("biz"),sc=document.getElementById("scene");
  bz.innerHTML=Object.keys(PRESETS).map(function(k){return '<option value="'+k+'">'+PRESETS[k].l+'</option>';}).join("");
  sc.innerHTML=Object.keys(SCENES).map(function(k){return '<option value="'+k+'">'+SCENES[k].l+'</option>';}).join("");
}
function applyPreset(){
  var p=PRESETS[document.getElementById("biz").value];
  if(document.getElementById("biz").value!=="custom"){
    document.getElementById("bname").value=p.name;
    document.getElementById("bloc").value=p.loc;
    document.getElementById("bsvc").value=p.svc.map(function(x){return x[0]+" | "+x[1];}).join("\n");
  }
  render();
}
function currentBiz(){
  var p=PRESETS[document.getElementById("biz").value];
  var svc=document.getElementById("bsvc").value.split("\n").map(function(l){var q=l.split("|");return [(q[0]||"").trim(),(q[1]||"").trim()];}).filter(function(x){return x[0];});
  if(!svc.length)svc=p.svc;
  return {name:document.getElementById("bname").value.trim()||p.name,loc:document.getElementById("bloc").value.trim()||p.loc,phone:p.phone||"",svc:svc,color:p.color};
}
function render(){
 var s=document.getElementById("scene").value;
 var cap=document.getElementById("capOn").checked?'<div class="cap">Illustration \u00b7 sample data</div>':'';
 var top='<div class="m-top"><div class="m-logo">\ud83d\udcca</div><div class="m-name">AI Business</div><div class="m-plan">Starter</div></div>';
 var count=parseInt(document.getElementById("count").value,10)||1;
 var mix=document.getElementById("mix").value;
 var note=document.getElementById("multiNote");
 if(MULTI[s] && count>1){
   var arr=buildList(count,mix,document.getElementById("biz").value);
   document.getElementById("mock").innerHTML=top+renderMulti(s,arr)+cap;
   if(note)note.textContent="List mode \u00b7 "+arr.length+" businesses ("+(mix==="mixed"?"mixed niches":"same niche")+"). Name/location/services fields apply to single views.";
 } else {
   var b=currentBiz();
   document.getElementById("mock").innerHTML=top+SCENES[s].render(b)+cap;
   if(note)note.textContent=MULTI[s]?"":"Single-document view \u00b7 switch scene to Lead Finder / WhatsApp / Social / Reviews for multi-business lists.";
 }
}
function loadH2C(){return new Promise(function(res,rej){if(window.html2canvas)return res();var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=function(){res();};s.onerror=function(){rej(new Error("cdn"));};document.head.appendChild(s);});}
function setStatus(t){var ld=document.getElementById("loading");if(ld){ld.style.display="block";ld.textContent=t;}}
function showGate(msg){var g=document.getElementById("gate");g.style.display="block";g.innerHTML=msg+' <button onclick="checkAdmin()" style="margin-left:8px;background:#ff5c00;border:none;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer">Retry now</button>';}
function attempt(n){
 setStatus("Contacting server\u2026 attempt "+n+"/"+MAX_TRY+" (trying all backends)");
 tryBackends("/api/me",{headers:{Authorization:"Bearer "+localStorage.getItem("token")}})
  .then(function(r){
    if(!r.ok){document.getElementById("loading").style.display="none";showGate("Reached a backend (status "+r.status+") but it refused the sign-in. Sign in as the owner account, then retry.");return null;}
    return r.json().then(function(d){
      document.getElementById("loading").style.display="none";
      if(d&&d.user&&d.user.email===ADMIN){document.getElementById("ui").style.display="block";fillSelects();applyPreset();}
      else{showGate("Reached a backend, but you're signed in as "+((d&&d.user&&d.user.email)||"an unknown account")+" \u2014 not the owner. Switch accounts and retry.");}
    });
  })
  .catch(function(){
    if(n<MAX_TRY){var wait=(n===1?3000:(n===2?6000:10000));setStatus("All backends unreachable. Auto-retrying in "+Math.round(wait/1000)+"s\u2026");setTimeout(function(){attempt(n+1);},wait);}
    else{document.getElementById("loading").style.display="none";showGate("After "+MAX_TRY+" tries: all backends unreachable. If your internet is on, they may all be asleep \u2014 wait ~30s and hit Retry.");}
  });
}
function checkAdmin(){attempt(1);}
document.getElementById("biz").addEventListener("change",applyPreset);
["scene","bname","bloc","bsvc","capOn","count","mix"].forEach(function(id){var el=document.getElementById(id);el.addEventListener("input",render);el.addEventListener("change",render);});
document.getElementById("dl").onclick=function(){
 var btn=this;btn.disabled=true;btn.textContent="Rendering\u2026";
 loadH2C().then(function(){return html2canvas(document.getElementById("mock"),{backgroundColor:"#0b1220",scale:2});}).then(function(c){
   var a=document.createElement("a");a.download="aib-mockshot-"+Date.now()+".png";a.href=c.toDataURL("image/png");a.click();
   btn.disabled=false;btn.textContent="\u2b07 Download PNG";
 }).catch(function(){btn.disabled=false;btn.textContent="\u2b07 Download PNG";alert("Image library couldn't load on this network \u2014 just screenshot the phone frame instead (it looks identical).");});
};
checkAdmin();
</script></body></html>
