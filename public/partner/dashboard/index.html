<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Dashboard</title><style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#e2e8f0;margin:0;padding:24px 16px;max-width:640px;margin:auto;line-height:1.6}h1{font-size:26px;color:#f8fafc}.green{color:#22c55e}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin:16px 0}input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:16px;margin:6px 0;box-sizing:border-box}button{width:100%;padding:14px;border:none;border-radius:8px;background:#22c55e;color:#0b1220;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}a.btn{display:block;text-align:center;padding:14px;border-radius:8px;background:#3b82f6;color:white;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;text-align:center}.stat b{display:block;font-size:24px;color:#22c55e}li{margin:6px 0}</style></head><body>
<h1>🤝 Partner Dashboard</h1>
<div class="grid"><div class="stat"><b id="clients">0</b>Active Clients</div><div class="stat"><b id="wallet">₦0</b>Wallet</div></div>
<div class="card"><strong>Your Partner Link</strong> — clients set up ONLY through this link:<br><br>
<input id="link" readonly onclick="this.select()"><br><br><button onclick="copyLink()">Copy Link</button></div>
<div class="card"><strong>Your Clients</strong><ul id="list"><li>Loading...</li></ul></div>
<div class="card"><strong>Withdraw Earnings</strong><br><button id="wd">Request Withdrawal</button>
<p id="wdstatus" style="color:#94a3b8;font-size:13px;margin-top:8px"></p></div>
<script>
var API="https://ai-business-1-ok3x.onrender.com";var tok=localStorage.getItem("token");
if(!tok){location.href="/auth";};
fetch(API+"/api/partner/me",{headers:{Authorization:"Bearer "+tok}}).then(function(r){return r.json();}).then(function(d){
 if(!d.success||!d.partner){location.href="/partner";return;}
 var p=d.partner;
 document.getElementById("link").value="https://www.ai-business.com.ng/?partner="+p.code;
 document.getElementById("wallet").textContent="₦"+(p.wallet_balance||0).toLocaleString();
 document.getElementById("clients").textContent=(d.clients||[]).length;
 var el=document.getElementById("list");
 if(!d.clients||!d.clients.length){el.innerHTML="<li>No clients yet. Share your link!</li>";}
 else{el.innerHTML=d.clients.map(function(c,i){return "<li>Client #"+(i+1)+" — joined "+new Date(c.created_at).toLocaleDateString()+"</li>";}).join("");}
 if(d.pending&&d.pending.length){document.getElementById("wdstatus").textContent="⏳ ₦"+d.pending[0].amount.toLocaleString()+" payout in progress.";document.getElementById("wd").disabled=true;}
 document.getElementById("wd").onclick=function(){
   fetch(API+"/api/partner/withdraw",{method:"POST",headers:{Authorization:"Bearer "+tok}}).then(function(r){return r.json();}).then(function(w){
     if(w.error){alert(w.error);return;}
     document.getElementById("wdstatus").textContent="✅ Request received. Payout within 48h.";document.getElementById("wd").disabled=true;});};
});
function copyLink(){var i=document.getElementById("link");i.select();document.execCommand("copy");alert("Link copied!");}
</script></body></html>
