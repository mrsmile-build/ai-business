  <style>
/* ===== TARGET v2 CSS ===== */
.target-card{margin-bottom:12px}

.target-syn{font-size:12px;color:#93c5fd;margin:0 0 12px;line-height:1.5}
.target-h{font-size:13px;font-weight:700;color:#f8fafc;margin:0 0 10px}
.target-prio{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #1e293b}

.target-prio.done .target-pt{color:#64748b;text-decoration:line-through}
.target-check{width:24px;height:24px;border-radius:50%;background:#1e293b;border:1px solid #334155;color:#3b82f6;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.target-prio.done .target-check{background:#10b981;border-color:#10b981;color:#fff}
.target-prio-main{flex:1;cursor:pointer}
.target-pt{font-size:13px;font-weight:600;color:#e2e8f0;margin:0 0 2px}
.target-pd{font-size:11px;color:#94a3b8;margin:0;line-height:1.45}
.target-open{font-size:11px;color:#60a5fa;font-weight:600;flex-shrink:0;align-self:center}
.target-focus{margin:14px 0 0;padding-top:12px;border-top:1px solid #1e293b}
.target-focus label{display:block;font-size:11px;color:#64748b;margin-bottom:6px}
.target-focus input{display:block;width:100%;box-sizing:border-box;background:#0b1220;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:8px;font-family:inherit}
.target-focus button{display:block;width:100%;background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.target-tip{font-size:11px;color:#60a5fa;margin:12px 0 0;padding:9px 11px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.22);border-radius:8px;line-height:1.5}
.target-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #1e293b}
.target-prog{font-size:11px;color:#94a3b8}.target-prog b{color:#3b82f6}
.target-dismiss{background:transparent;border:1px solid #334155;color:#94a3b8;padding:5px 12px;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit}
.target-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.target-modal-box{background:#0f172a;border:1px solid #2563eb;border-radius:14px;padding:24px;max-width:380px;width:100%}
.target-modal-h{font-size:16px;font-weight:800;color:#f8fafc;margin:0 0 4px}
.target-modal-d{font-size:12px;color:#94a3b8;margin:0 0 14px}
.target-modal-btn{display:block;width:100%;padding:11px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:13px;margin-bottom:6px;cursor:pointer;text-align:left;font-family:inherit}
.target-modal-btn:hover{border-color:#3b82f6}
.target-modal-btn.life{border-color:rgba(245,158,11,.35)}
</style>
</style>
</head>

<body>

<div class="container">

  <h1>📊 AI Business Dashboard</h1>

  <input id="user_id" placeholder="Enter User ID (test123)">
  <button onclick="loadLeads()">Load Leads</button>

  <div class="card">
    <b>Total Leads:</b>
    <span id="total">0</span>
  </div>

  <div class="card">
    <b>Status:</b>
    <span id="status">Idle</span>
  </div>

  <div id="leads"></div>

</div>

<script>
async function loadLeads() {
  const user_id =
    document.getElementById("user_id").value.trim();

  if (!user_id) {
    alert("Enter a User ID");
    return;
  }

  document.getElementById("status").innerText =
    "Loading...";

  try {
    const res =
      await fetch("/api/leads/" + user_id);

    const data = await res.json();

    const leads = data.leads || [];

    document.getElementById("total").innerText =
      leads.length;

    document.getElementById("status").innerText =
      "Live ✔";

    document.getElementById("leads").innerHTML =
      leads.map(lead => `
        <div class="card">
          <h3>${lead.name}</h3>
          <p><b>Phone:</b> ${lead.phone}</p>
          <p><b>Message:</b> ${lead.message}</p>
          <p><b>AI Reply:</b> ${lead.ai_reply || "Not generated yet"}</p>
        </div>
      `).join("");

  } catch(err) {
    document.getElementById("status").innerText =
      "Error ❌";
  }
}
</script>

<script src="/movebar.js"></script><script src="/sb-keys.js"></script>
<script>
(function(){try{var c=new URLSearchParams(location.search).get('partner');if(c)localStorage.setItem('ab_partner',c);
var code=localStorage.getItem('ab_partner');var tok=localStorage.getItem('token');if(!code||!tok)return;
fetch("https://ai-business-1-ok3x.onrender.com/api/partner/attach",{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({code:code})})
.then(function(r){return r.json();}).then(function(d){if(d.success)localStorage.removeItem('ab_partner');}).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
