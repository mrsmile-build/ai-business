<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#111827;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
}

.menu-btn{
  font-size:26px;
  cursor:pointer;
}

/* MENU */
.menu{overflow-y:auto;max-height:calc(100vh - 60px);
  position:fixed;
  top:60px;
  right:15px;
  background:#111827;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  width:180px;
  display:none;
  z-index:2000;
}

.menu div{
  padding:12px;
  cursor:pointer;
}

.menu div:hover{
  background:#1f2937;
}

/* CONTENT */
.container{
  padding:80px 15px 30px;
}

.card{
  background:#1e293b;
  padding:18px;
  border-radius:14px;
  margin-top:10px;
  border:1px solid rgba(255,255,255,0.05);
}

/* BUTTONS */
button {
  font-family: Arial, sans-serif;
  transition: opacity 0.15s, transform 0.15s;
}
button:active { transform: scale(0.97); opacity: 0.85; }

/* INPUTS */
input, textarea, select {
  font-family: Arial, sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus {
  border-color: #3b82f6 !important;
}

/* TOPBAR LOGO */
.topbar div:first-child {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.3px;
}

/* MENU */
.menu div {
  padding: 14px 16px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 14px;
  transition: background 0.15s;
}
.menu div:last-child { border-bottom: none; }
.menu div:hover { background: #1f2937; color: white; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>

<script>
(function(){try{var c=new URLSearchParams(location.search).get('partner');if(c)localStorage.setItem('ab_partner',c);
var code=localStorage.getItem('ab_partner');var tok=localStorage.getItem('token');if(!code||!tok)return;
fetch("https://ai-business-1-ok3x.onrender.com/api/partner/attach",{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({code:code})})
.then(function(r){return r.json();}).then(function(d){if(d.success)localStorage.removeItem('ab_partner');}).catch(function(){});
}catch(e){}})();
</script>

<script>
(function(){var p=new URLSearchParams(location.search).get('page');if(!p)return;window.__abDeepLink=p;
function fire(){try{if(typeof loadPage==='function'&&localStorage.getItem('token')){loadPage(window.__abDeepLink);return true;}}catch(e){}return false;}
setTimeout(function(){fire();setTimeout(fire,1800);},2500);})();
</script>
<script>
if(typeof window.shareBizPage!=="function"){
window.shareBizPage=function(){
  var tok=localStorage.getItem("token");
  fetch("https://ai-business-1-ok3x.onrender.com/api/trial/assets",{headers:{Authorization:"Bearer "+tok}}).then(function(r){return r.json();}).then(function(d){
    var u=d&&d.report&&d.report.business&&d.report.business.url;
    if(!u){alert("Save your Business Page first: Menu → My Business Page.");return;}
    if(navigator.share){navigator.share({title:"My business on AI Business",url:u});}
    else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){alert("Link copied!\n\n"+u);});}
    else{prompt("Copy your link:",u);}
  }).catch(function(){alert("Could not load your link.");});
};}
</script>
<script>(function(){
var MAP=[["Promo Video","feat_promo"],["Your Assets","feat_assets"],["Earn with Us","feat_earn"],["Share My Business Page","feat_share"]];
function run(){MAP.forEach(function(m){document.querySelectorAll("div[onclick]").forEach(function(d){if(d.textContent.indexOf(m[0])!==-1&&!d.querySelector(".newbadge")){if(localStorage.getItem(m[1]))return;var s=document.createElement("span");s.className="newbadge";s.textContent="NEW";d.appendChild(s);d.setAttribute("onclick","localStorage.setItem('"+m[1]+"','1');"+d.getAttribute("onclick"));}});});}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",run);}else{run();}
})();</script>





<!-- AIB_BANNER_START --><style>
.aib-banner{position:relative;background:linear-gradient(135deg,#1d140d 0%,#160e08 100%);border:1px solid rgba(255,120,40,.22);border-left:3px solid #ff7a1a;border-radius:13px;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);padding:11px 13px;margin:10px 14px 12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-family:system-ui,-apple-system,sans-serif}
.aib-banner .ico{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:radial-gradient(120% 120% at 30% 20%,rgba(255,140,40,.32),rgba(255,90,0,.1));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:inset 0 0 0 1px rgba(255,150,60,.22)}
.aib-banner .txt{flex:1 1 160px;min-width:0}
.aib-banner .ttl{color:#fff;font-size:13.5px;font-weight:700;letter-spacing:.1px;line-height:1.25}
.aib-banner .bdy{color:#e3c4a6;font-size:12px;line-height:1.45;margin-top:2px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aib-banner .cta{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#ff7a1a,#ff5c00);color:#fff;font-weight:700;font-size:12px;padding:8px 13px;border-radius:9px;text-decoration:none;white-space:nowrap;box-shadow:0 4px 12px rgba(255,92,0,.3);transition:transform .15s ease,box-shadow .15s ease}
.aib-banner .cta:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(255,92,0,.4)}
.aib-banner .x{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:#c9b6a4;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease}
.aib-banner .x:hover{background:rgba(255,255,255,.14);color:#fff}
</style>
<script>
(function(){
  /* self-heal: whatever scars the file carries, the live page ends with exactly one banner and no orphan x */
  document.querySelectorAll('.aib-banner').forEach(function(n){n.remove();});
  document.querySelectorAll('button.x').forEach(function(n){ if(!n.closest('.aib-banner')) n.remove(); });
  fetch('/announcements.json?_='+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
    var a=d&&d.latest; if(!a||!a.title) return;
    var ver=String(a.v||a.title).replace(/[^A-Za-z0-9]+/g,'_').slice(0,40);
    var key='aib_seen_'+ver;                       /* per-version: a NEW announcement always re-shows */
    if(localStorage.getItem(key)) return;
    var chars=Array.from(a.title), icon='✨', title=a.title;
    if(chars[0] && chars[0].codePointAt(0)>0x2100){ icon=chars[0]; title=chars.slice(1).join('').replace(/^\s+/,''); }
    var el=document.createElement('div'); el.className='aib-banner';
    var ico=document.createElement('div'); ico.className='ico'; ico.textContent=icon;
    var txt=document.createElement('div'); txt.className='txt';
    var ttl=document.createElement('div'); ttl.className='ttl'; ttl.textContent=title;
    var bdy=document.createElement('div'); bdy.className='bdy'; bdy.textContent=a.body||'';
    txt.appendChild(ttl); txt.appendChild(bdy); el.appendChild(ico); el.appendChild(txt);
    if(a.cta_url){var c=document.createElement('a'); c.className='cta'; c.href=a.cta_url; c.textContent=(a.cta_label||'Open')+' →'; el.appendChild(c);}
    var x=document.createElement('button'); x.className='x'; x.setAttribute('aria-label','Dismiss'); x.textContent='×';
    x.onclick=function(){ el.remove(); try{localStorage.setItem(key,String(Date.now()));}catch(e){} };
    el.appendChild(x);
    var hd=document.querySelector('header')||document.querySelector('.topbar')||document.querySelector('nav');
    if(hd && hd.parentNode){
      if(getComputedStyle(hd).position==='fixed'){ el.style.marginTop=(hd.offsetHeight+8)+'px'; }
      hd.parentNode.insertBefore(el, hd.nextSibling);     /* after the bar, in normal flow -> can't be covered */
    } else { document.body.insertBefore(el, document.body.firstChild); }
  }).catch(function(){});
})();
</script><!-- AIB_BANNER_END -->
</body>
